name: CI

on:
  push:
    branches: [develop, main]   # runs after a merge (or push) into develop / main
  pull_request:
    branches: [develop, main]   # runs on every PR under review into develop / main
  workflow_dispatch:            # optional manual run from the Actions tab
# Pushes to feature/* or docs/* branches alone do NOT trigger CI;
# they are checked once a PR into develop/main is opened.

permissions:
  contents: read

# Cancel an older run of the same branch/PR when a new commit is pushed
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
