# ---- Shared configuration (all profiles). Secrets come ONLY from environment variables. ----
spring.application.name=classsync
server.port=${PORT:8080}
spring.profiles.default=dev

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# CORS: comma-separated list of allowed frontend origins
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# JWT (JWT_SECRET must be at least 32 characters)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Initial admin account (created on first start if ADMIN_PASSWORD is set)
app.admin.email=${ADMIN_EMAIL:admin@classsync.local}
app.admin.password=${ADMIN_PASSWORD:}

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
