# Test profile: in-memory H2, fixed non-secret values. Used by every @SpringBootTest via @ActiveProfiles("test").
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=test-only-secret-key-that-is-at-least-32-bytes-long
app.jwt.expiration-minutes=60
app.admin.email=admin@test.local
app.admin.password=admin12345
