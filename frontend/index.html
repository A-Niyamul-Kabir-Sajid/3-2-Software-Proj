<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClassSync</title>
  <meta name="theme-color" content="#e8300f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div class="bg-word" aria-hidden="true">CLASS</div>
  <header class="top">
    <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"> ClassSync</div>
    <nav id="nav" class="nav"></nav>
    <div class="tools">
      <span id="net" class="pill ok">Online</span>
      <select id="role" class="pill" aria-label="Role">
        <option value="STUDENT">Student</option>
        <option value="CR">CR</option>
        <option value="TEACHER">Teacher</option>
      </select>
      <button id="install" class="btn" hidden>Install app</button>
    </div>
  </header>
  <main id="view" class="view"></main>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
